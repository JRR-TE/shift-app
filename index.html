<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>班长交接班系统 V4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a73e8; --primary-dark: #1557b0;
            --success: #0d904f; --warning: #e37400; --danger: #d93025;
            --bg: #f0f2f5; --card-bg: #fff; --text: #202124;
            --text-secondary: #5f6368; --border: #dadce0;
            --shadow: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-lg: 0 4px 12px rgba(0,0,0,0.15);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 20px; }
        .header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-lg); }
        .header h1 { font-size: 18px; font-weight: 600; text-align: center; }
        .header .subtitle { font-size: 11px; text-align: center; opacity: 0.85; margin-top: 3px; }
        .header .current-time { font-size: 11px; text-align: center; opacity: 0.7; margin-top: 2px; }
        .sync-status { font-size: 10px; text-align: center; margin-top: 2px; }
        .sync-online { color: #a8f0c6; }
        .sync-offline { color: #ffcc80; }
        .tab-nav { display: flex; background: white; border-bottom: 1px solid var(--border); position: sticky; top: 72px; z-index: 99; overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 55px; padding: 9px 2px; text-align: center; font-size: 10px; font-weight: 500; color: var(--text-secondary); background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-btn .tab-icon { font-size: 18px; display: block; margin-bottom: 2px; }
        .tab-content { display: none; padding: 12px; max-width: 600px; margin: 0 auto; }
        .tab-content.active { display: block; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; }
        .required { color: var(--danger); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); background: #fafbfc; -webkit-appearance: none; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.12); background: white; }
        .form-group textarea { min-height: 70px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .btn-success { background: linear-gradient(135deg, var(--success), #0a7a43); color: white; }
        .btn-danger { background: var(--danger); color: white; padding: 5px 10px; width: auto; font-size: 11px; border-radius: 6px; }
        .btn-small { padding: 6px 12px; width: auto; font-size: 11px; border-radius: 6px; }
        .btn-outline { background: white; color: var(--primary); border: 1.5px solid var(--primary); padding: 6px 12px; width: auto; font-size: 11px; border-radius: 6px; }
        .btn-warning { background: var(--warning); color: white; padding: 6px 10px; width: auto; font-size: 11px; border-radius: 6px; }
        .shift-selector { display: flex; gap: 10px; }
        .shift-option { flex: 1; padding: 12px 8px; text-align: center; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; background: white; }
        .shift-option.selected { border-color: var(--primary); background: rgba(26,115,232,0.06); color: var(--primary); }
        .shift-option .shift-icon { font-size: 24px; display: block; margin-bottom: 4px; }
        .task-block { background: #f8f9ff; border: 1.5px solid #d0d9f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .task-block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .task-block-num { font-size: 12px; font-weight: 600; color: var(--primary); background: #e8f0fe; padding: 3px 10px; border-radius: 12px; }
        .task-id-display { font-size: 10px; color: #999; font-family: monospace; }
        .add-task-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 2px dashed var(--primary); border-radius: 10px; background: rgba(26,115,232,0.03); color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
        .task-item { background: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 8px; box-shadow: var(--shadow); border-left: 4px solid var(--primary); }
        .task-item.status-completed { border-left-color: var(--success); opacity: 0.85; }
        .task-item.status-in-progress { border-left-color: var(--warning); }
        .task-item.status-pending { border-left-color: var(--danger); }
        .task-item.status-transferred { border-left-color: #9c27b0; }
        .task-title-text { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
        .task-id { font-size: 10px; color: #aaa; font-family: monospace; margin-bottom: 5px; }
        .task-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
        .task-tag { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 500; }
        .tag-shift { background: #e8f0fe; color: var(--primary); }
        .tag-priority-high { background: #fce8e6; color: var(--danger); }
        .tag-priority-medium { background: #fef7e0; color: var(--warning); }
        .tag-priority-low { background: #e6f4ea; color: var(--success); }
        .status-pending-tag { background: #fce8e6; color: var(--danger); }
        .status-in-progress-tag { background: #fef7e0; color: var(--warning); }
        .status-completed-tag { background: #e6f4ea; color: var(--success); }
        .status-transferred-tag { background: #f3e5f5; color: #9c27b0; }
        .tag-area { background: #e0f2fe; color: #0277bd; }
        .task-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 5px; }
        .task-info { font-size: 11px; color: #aaa; }
        .task-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0f0f0; }
        .task-actions select { padding: 6px 8px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 11px; background: white; flex: 1; }
        .progress-section { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e0e0e0; }
        .progress-header { font-size: 11px; font-weight: 600; margin-bottom: 4px; color: var(--primary); }
        .progress-item { font-size: 11px; color: var(--text-secondary); padding: 3px 0; line-height: 1.5; border-bottom: 1px dotted #f0f0f0; }
        .progress-item:last-child { border-bottom: none; }
        .progress-time { color: var(--primary); font-weight: 500; font-size: 10px; }
        .transfer-info { background: #f3e5f5; border-radius: 6px; padding: 6px 10px; font-size: 11px; color: #9c27b0; margin-top: 6px; }
        .filter-section { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; }
        .filter-btn { padding: 5px 12px; border: 1.5px solid var(--border); border-radius: 16px; font-size: 11px; background: white; color: var(--text-secondary); cursor: pointer; white-space: nowrap; font-weight: 500; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .stat-card { background: var(--card-bg); border-radius: 10px; padding: 14px 10px; text-align: center; box-shadow: var(--shadow); }
        .stat-number { font-size: 28px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
        .stat-card.warning .stat-number { color: var(--warning); }
        .stat-card.danger .stat-number { color: var(--danger); }
        .stat-card.success .stat-number { color: var(--success); }
        .stat-card.purple .stat-number { color: #9c27b0; }
        .progress-bar-bg { background: #e8eaed; border-radius: 10px; height: 24px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { background: linear-gradient(90deg, var(--success), #34a853); height: 100%; border-radius: 10px; transition: width 0.6s; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 600; min-width: 35px; }
        .cat-bar-item { margin-bottom: 10px; }
        .cat-bar-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
        .cat-bar-bg { background: #e8eaed; border-radius: 4px; height: 7px; overflow: hidden; }
        .cat-bar-fill { background: var(--primary); height: 100%; border-radius: 4px; }
        .export-section { display: flex; gap: 8px; margin-bottom: 10px; }
        .export-btn { flex: 1; padding: 9px; border: 1.5px solid var(--border); border-radius: 8px; background: white; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: 500; }
        .handover-record { background: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 8px; box-shadow: var(--shadow); border-left: 4px solid var(--success); }
        .handover-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .handover-shift { font-weight: 600; font-size: 13px; }
        .handover-time { font-size: 11px; color: var(--text-secondary); }
        .handover-summary { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
        .leader-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f8f9fa; border-radius: 8px; margin-bottom: 6px; }
        .leader-name { font-size: 13px; font-weight: 500; }
        .leader-shift-tag { font-size: 11px; color: var(--text-secondary); }
        .empty-state { text-align: center; padding: 30px 20px; color: var(--text-secondary); }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
        .empty-state p { font-size: 13px; }
        .loading { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 13px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: white; border-radius: 16px 16px 0 0; padding: 18px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-header h3 { font-size: 15px; }
        .modal-close { background: #f0f0f0; border: none; font-size: 16px; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #323232; color: white; padding: 10px 20px; border-radius: 10px; font-size: 13px; z-index: 1000; opacity: 0; transition: all 0.3s; max-width: 90%; text-align: center; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .search-box { position: relative; margin-bottom: 10px; }
        .search-box input { width: 100%; padding: 9px 11px 9px 34px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 13px; background: white; }
        .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; }
        .divider { height: 1px; background: var(--border); margin: 12px 0; }
        .section-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
        .badge { display: inline-flex; align-items: center; justify-content: center; background: var(--danger); color: white; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px; margin-left: 4px; }
        .info-box { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #e65100; margin-bottom: 12px; line-height: 1.5; }
        .admin-lock { background: #fce8e6; border: 1px solid #f5c6c6; border-radius: 12px; padding: 30px 20px; text-align: center; }
        .admin-lock .lock-icon { font-size: 48px; margin-bottom: 12px; }
        .admin-lock p { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
        .pwd-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; text-align: center; letter-spacing: 2px; margin-bottom: 12px; }
        .pwd-input:focus { outline: none; border-color: var(--primary); }
        .admin-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-bottom: 12px; }
        .admin-status.unlocked { background: #e6f4ea; color: var(--success); }
    </style>
</head>
<body>

<div class="header">
    <h1>📋 班长交接班系统</h1>
    <div class="subtitle">TE Connectivity · 亚洲工厂数字化平台</div>
    <div class="current-time" id="currentTime"></div>
    <div class="sync-status" id="syncStatus">⏳ 连接中...</div>
</div>

<div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('create',this)"><span class="tab-icon">✏️</span>新建</button>
    <button class="tab-btn" onclick="switchTab('inbox',this)"><span class="tab-icon">📥</span>待确认<span id="inboxBadge"></span></button>
    <button class="tab-btn" onclick="switchTab('tasks',this)"><span class="tab-icon">📋</span>任务<span id="taskBadge"></span></button>
    <button class="tab-btn" onclick="switchTab('handover',this)"><span class="tab-icon">🤝</span>交接</button>
    <button class="tab-btn" onclick="switchTab('stats',this)"><span class="tab-icon">📊</span>统计</button>
    <button class="tab-btn" onclick="switchTab('admin',this)"><span class="tab-icon">⚙️</span>管理</button>
</div>

<div id="tab-create" class="tab-content active">
    <div class="card">
        <div class="card-title">✏️ 创建交接任务</div>
        <div class="form-group">
            <label>当前班次 <span class="required">*</span></label>
            <div class="shift-selector">
                <div class="shift-option selected" onclick="selectShift(this,'D')"><span class="shift-icon">☀️</span>D班</div>
                <div class="shift-option" onclick="selectShift(this,'N')"><span class="shift-icon">🌙</span>N班</div>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>交班班长 <span class="required">*</span></label><select id="fromLeader"><option value="">请选择</option></select></div>
            <div class="form-group"><label>接班班长 <span class="required">*</span></label><select id="toLeader"><option value="">请选择</option></select></div>
        </div>
        <div class="divider"></div>
        <div class="section-label">📝 交接任务列表</div>
        <div id="taskBlocksContainer"></div>
        <div class="add-task-btn" onclick="addTaskBlock()">＋ 添加任务</div>
        <button class="btn btn-primary" onclick="submitAllTasks()">📤 提交所有交接任务</button>
    </div>
</div>

<div id="tab-inbox" class="tab-content">
    <div class="info-box">📌 选择你的姓名，查看分配给你的任务。未完成的任务可以转交给下一位班长。</div>
    <div class="form-group"><label>选择我的姓名</label><select id="myName" onchange="onMyNameChange()"><option value="">请选择</option></select></div>
    <div id="inboxList"></div>
</div>

<div id="tab-tasks" class="tab-content">
    <div class="search-box"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="搜索任务..." oninput="renderTasks()"></div>
    <div class="filter-section">
        <button class="filter-btn active" onclick="filterTasks('all',this)">全部</button>
        <button class="filter-btn" onclick="filterTasks('pending',this)">🔴 待处理</button>
        <button class="filter-btn" onclick="filterTasks('in-progress',this)">🟡 进行中</button>
        <button class="filter-btn" onclick="filterTasks('completed',this)">🟢 已完成</button>
        <button class="filter-btn" onclick="filterTasks('transferred',this)">🟣 已转交</button>
    </div>
    <div id="taskList"><div class="loading">⏳ 加载中...</div></div>
</div>

<div id="tab-handover" class="tab-content">
    <div class="section-label">📜 历史交接记录</div>
    <div id="handoverList"><div class="loading">⏳ 加载中...</div></div>
</div>

<div id="tab-stats" class="tab-content">
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-number" id="statTotal">0</div><div class="stat-label">总任务数</div></div>
        <div class="stat-card danger"><div class="stat-number" id="statPending">0</div><div class="stat-label">待处理</div></div>
        <div class="stat-card warning"><div class="stat-number" id="statProgress">0</div><div class="stat-label">进行中</div></div>
        <div class="stat-card success"><div class="stat-number" id="statCompleted">0</div><div class="stat-label">已完成</div></div>
        <div class="stat-card purple"><div class="stat-number" id="statTransferred">0</div><div class="stat-label">已转交</div></div>
        <div class="stat-card"><div class="stat-number" id="statHandovers">0</div><div class="stat-label">交接次数</div></div>
    </div>
    <div class="card"><div class="card-title">📈 完成率</div><div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar" style="width:0%;">0%</div></div></div>
    <div class="card"><div class="card-title">📊 按类别统计</div><div id="categoryStats"></div></div>
    <div class="card"><div class="card-title">📅 按班次统计</div><div id="shiftStats"></div></div>
    <div class="export-section">
        <button class="export-btn" onclick="exportCSV()">📊 导出CSV</button>
        <button class="export-btn" onclick="exportJSON()">📥 导出JSON</button>
    </div>
    <div class="export-section">
        <button class="export-btn" style="color:var(--danger);border-color:var(--danger);font-weight:700;" onclick="clearTasksOnly()">🗑️ 清空任务数据（保留班长名单）</button>
    </div>
</div>

<div id="tab-admin" class="tab-content">
    <div id="adminLockScreen" class="admin-lock">
        <div class="lock-icon">🔐</div>
        <p>此页面仅限管理员访问<br>请输入管理员密码</p>
        <input type="password" class="pwd-input" id="adminPwdInput" placeholder="请输入密码" onkeydown="if(event.key==='Enter')checkAdminPwd()">
        <button class="btn btn-primary" onclick="checkAdminPwd()">🔓 验证密码</button>
    </div>
    <div id="adminContent" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <span class="admin-status unlocked">🟢 管理员已登录</span>
            <button class="btn btn-danger" onclick="lockAdmin()" style="width:auto;padding:6px 14px;font-size:12px;">🔒 退出管理</button>
        </div>
        <div class="card">
            <div class="card-title">👥 班长名单管理</div>
            <div class="info-box">✅ 在此添加的班长名单会实时同步到所有设备！</div>
            <div class="form-row">
                <div class="form-group"><label>班长姓名</label><input type="text" id="newLeaderName" placeholder="输入姓名"></div>
                <div class="form-group"><label>所属班次</label><select id="newLeaderShift"><option value="D">☀️ D班</option><option value="N">🌙 N班</option><option value="both">两班</option></select></div>
            </div>
            <button class="btn btn-primary" onclick="addLeader()" style="margin-bottom:14px;">➕ 添加班长</button>
            <div class="section-label">当前班长名单</div>
            <div id="leaderList"><div class="loading">⏳ 加载中...</div></div>
        </div>
    </div>
</div>

<div id="taskModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-content">
        <div class="modal-header"><h3 id="modalTitle">操作</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
        <div id="modalBody"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
var API_BASE = 'https://shift-app-6u7.pages.dev';
var ADMIN_PASSWORD = 'Tec.123456';
var isAdminUnlocked = sessionStorage.getItem('adminUnlocked')==='1';
if(isAdminUnlocked){
    setTimeout(function(){
        var ls=document.getElementById('adminLockScreen');
        var ac=document.getElementById('adminContent');
        if(ls)ls.style.display='none';
        if(ac)ac.style.display='block';
    },100);
}

var currentShift='D', currentFilter='all', taskBlockCount=0;
var allTasks=[], allLeaders=[], allHandovers=[];

function updateClock(){
    var n=new Date();
    var el=document.getElementById('currentTime');
    if(el)el.textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 '+
        n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+':'+n.getSeconds().toString().padStart(2,'0');
}
updateClock();setInterval(updateClock,1000);

function genId(){return 'T'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).substr(2,4).toUpperCase();}
function fmtTime(ts){
    if(!ts)return '';
    var d=new Date(ts);
    if(isNaN(d.getTime()))return ts;
    return (d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0')+' '+
        d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}
function catName(c){return{quality:'品质问题',equipment:'设备异常',material:'物料问题',safety:'安全事项',production:'生产任务',personnel:'人员安排',other:'其他'}[c]||c;}
function statusName(s){return{pending:'待处理','in-progress':'进行中',completed:'已完成',transferred:'已转交'}[s]||s;}
function esc(t){var d=document.createElement('div');d.textContent=t||'';return d.innerHTML;}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2500);}

async function api(path,method,body){
    var opts={method:method||'GET',headers:{'Content-Type':'application/json'}};
    if(body)opts.body=JSON.stringify(body);
    var res=await fetch(API_BASE+path,opts);
    return await res.json();
}

async function loadAll(){

        var results=await Promise.all([
            api('/api/leaders'),
            api('/api/tasks'),

        ]);
        allLeaders=results[0]||[];

        allHandovers=results[2]||[];
        refreshLeaderSelects();
        renderTasks();
        renderStats();
        renderHandoverList();

async function submitAllTasks(){
    var fromLeader=document.getElementById('fromLeader').value;
    var toLeader=document.getElementById('toLeader').value;
    if(!fromLeader){showToast('⚠️ 请选择交班班长');return;}
    if(!toLeader){showToast('⚠️ 请选择接班班长');return;}
    var blocks=document.querySelectorAll('.task-block');
    if(blocks.length===0){showToast('⚠️ 请至少添加一个任务');return;}
    var newTasks=[],valid=true;
    blocks.forEach(function(block){
        var title=block.querySelector('.tb-title').value.trim();
        if(!title){valid=false;return;}
        newTasks.push({
            taskId:block.querySelector('.tb-id').value,
            shift:currentShift,fromLeader:fromLeader,toLeader:toLeader,
            title:title,description:block.querySelector('.tb-desc').value.trim(),
            area:block.querySelector('.tb-area').value,
            priority:block.querySelector('.tb-priority').value,
            category:block.querySelector('.tb-category').value
        });
    });
    if(!valid){showToast('⚠️ 请填写所有任务标题');return;}
    var res=await api('/api/tasks','POST',{
        tasks:newTasks,
        handover:{shift:currentShift,fromLeader:fromLeader,toLeader:toLeader,taskCount:newTasks.length}
    });
    if(res.success){
        document.getElementById('taskBlocksContainer').innerHTML='';
        taskBlockCount=0;addTaskBlock();
        showToast('✅ 提交成功！'+newTasks.length+'项任务已交接给'+toLeader);
        loadAll();
    }else showToast('❌ 提交失败: '+(res.error||''));
}

function updateInboxBadge(){
    var myName=document.getElementById('myName').value;
    var badge=document.getElementById('inboxBadge');
    if(!myName||!badge){if(badge)badge.innerHTML='';return;}
    var count=allTasks.filter(function(t){return t.to_leader===myName&&(t.status==='pending'||t.status==='in-progress');}).length;
    badge.innerHTML=count>0?'<span class="badge">'+count+'</span>':'';
}

function updateTaskBadge(){
    var badge=document.getElementById('taskBadge');
    if(!badge)return;
    var myName=document.getElementById('myName').value;
    var count=0;
    if(myName){
        // 选择了班长：显示本人未完成任务数
        count=allTasks.filter(function(t){
            return t.to_leader===myName&&(t.status==='pending'||t.status==='in-progress');
        }).length;
    }else{
        // 未选择班长：显示全部未完成任务数
        count=allTasks.filter(function(t){
            return t.status==='pending'||t.status==='in-progress';
        }).length;
    }
    badge.innerHTML=count>0?'<span class="badge">'+count+'</span>':'';
}

function renderInbox(){
    var myName=document.getElementById('myName').value;
    var container=document.getElementById('inboxList');
    if(!myName){container.innerHTML='<div class="empty-state"><div class="icon">👆</div><p>请先选择你的姓名</p></div>';return;}
    var tasks=allTasks.filter(function(t){return t.to_leader===myName;});
    if(tasks.length===0){container.innerHTML='<div class="empty-state"><div class="icon">🎉</div><p>没有分配给你的任务</p></div>';return;}
    var pending=tasks.filter(function(t){return t.status==='pending'||t.status==='in-progress';});
    var done=tasks.filter(function(t){return t.status==='completed'||t.status==='transferred';});
    var html='';
    if(pending.length>0){
        html+='<div class="section-label">⏳ 需要处理 ('+pending.length+'项)</div>';
        pending.forEach(function(task){html+=renderInboxItem(task,myName);});
    }
    if(done.length>0){
        html+='<div class="section-label" style="margin-top:12px;">✅ 已处理 ('+done.length+'项)</div>';
        done.forEach(function(task){html+=renderInboxItem(task,myName);});
    }
    container.innerHTML=html;
}

function renderInboxItem(task,myName){
    var pLabel=task.priority==='high'?'🔴 高':task.priority==='medium'?'🟡 中':'🟢 低';
    var isDone=task.status==='completed'||task.status==='transferred';
    var progress=Array.isArray(task.progress)?task.progress:[];
    var transferHistory=Array.isArray(task.transfer_history)?task.transfer_history:[];
    var html='<div class="task-item status-'+task.status+'">';
    html+='<div class="task-id">🔑 '+esc(task.task_id)+'</div>';
    html+='<div class="task-title-text">'+esc(task.title)+'</div>';
    html+='<div class="task-meta">';
    html+='<span class="task-tag tag-shift">'+task.shift+'班</span>';
    html+='<span class="task-tag tag-priority-'+task.priority+'">'+pLabel+'</span>';
    html+='<span class="task-tag tag-area">📍 '+esc(task.area)+'</span>';
    html+='<span class="task-tag status-'+task.status+'-tag">'+statusName(task.status)+'</span>';
    html+='</div>';
    if(task.description)html+='<div class="task-desc">'+esc(task.description)+'</div>';
    html+='<div class="task-info">👤 来自: <strong>'+esc(task.from_leader)+'</strong> · 🕐 '+fmtTime(task.created_at)+'</div>';
    if(transferHistory.length>0){
        html+='<div class="transfer-info">🔄 转交: '+transferHistory.map(function(h){return esc(h.from)+' → '+esc(h.to);}).join(' → ')+'</div>';
    }
    if(progress.length>0){
        html+='<div class="progress-section"><div class="progress-header">📝 进度</div>';
        progress.slice(-3).forEach(function(p){html+='<div class="progress-item"><span class="progress-time">['+fmtTime(p.time)+']</span> '+esc(p.content)+'</div>';});
        html+='</div>';
    }
    if(!isDone){
        html+='<div class="task-actions">';
        html+='<select id="inboxStatus_'+task.task_id+'">';
        html+='<option value="pending"'+(task.status==='pending'?' selected':'')+'>⏳ 待处理</option>';
        html+='<option value="in-progress"'+(task.status==='in-progress'?' selected':'')+'>🔄 进行中</option>';
        html+='<option value="completed">✅ 已完成</option>';
        html+='</select>';
        html+='<button class="btn btn-success btn-small" onclick="confirmInboxTask(\''+task.task_id+'\')">✅ 确认</button>';
        html+='<button class="btn btn-warning btn-small" onclick="openTransferModal(\''+task.task_id+'\',\''+esc(myName)+'\')">🔄 转交</button>';
        html+='</div>';
    }
    html+='</div>';
    return html;
}

function renderStats(){
    var tasks=allTasks,total=tasks.length;
    var pending=tasks.filter(function(t){return t.status==='pending';}).length;
    var inProg=tasks.filter(function(t){return t.status==='in-progress';}).length;
    var completed=tasks.filter(function(t){return t.status==='completed';}).length;
    var transferred=tasks.filter(function(t){return t.status==='transferred';}).length;
    document.getElementById('statTotal').textContent=total;
    document.getElementById('statPending').textContent=pending;
    document.getElementById('statProgress').textContent=inProg;
    document.getElementById('statCompleted').textContent=completed;
    document.getElementById('statTransferred').textContent=transferred;
    document.getElementById('statHandovers').textContent=allHandovers.length;
    var rate=total>0?Math.round((completed/total)*100):0;
    var bar=document.getElementById('progressBar');
    bar.style.width=Math.max(rate,3)+'%';bar.textContent=rate+'%';
    var cats={};
    tasks.forEach(function(t){var c=catName(t.category);cats[c]=(cats[c]||0)+1;});
    var catHtml='';
    if(Object.keys(cats).length===0){catHtml='<p style="font-size:12px;color:#999;text-align:center;">暂无数据</p>';}
    else{Object.entries(cats).sort(function(a,b){return b[1]-a[1];}).forEach(function(item){
        var pct=total>0?Math.round((item[1]/total)*100):0;
        catHtml+='<div class="cat-bar-item"><div class="cat-bar-header"><span>'+item[0]+'</span><span>'+item[1]+' ('+pct+'%)</span></div>';
        catHtml+='<div class="cat-bar-bg"><div class="cat-bar-fill" style="width:'+pct+'%;"></div></div></div>';
    });}
    document.getElementById('categoryStats').innerHTML=catHtml;
    var shifts={D:0,N:0};
    tasks.forEach(function(t){shifts[t.shift]=(shifts[t.shift]||0)+1;});
    var shiftHtml='';
    [{k:'D',label:'☀️ D班',color:'#e37400'},{k:'N',label:'🌙 N班',color:'#3949ab'}].forEach(function(s){
        var pct=total>0?Math.round((shifts[s.k]/total)*100):0;
        shiftHtml+='<div class="cat-bar-item"><div class="cat-bar-header"><span>'+s.label+'</span><span>'+shifts[s.k]+' ('+pct+'%)</span></div>';
        shiftHtml+='<div class="cat-bar-bg"><div class="cat-bar-fill" style="width:'+pct+'%;background:'+s.color+';"></div></div></div>';
    });
    document.getElementById('shiftStats').innerHTML=shiftHtml;
}

    allTasks.forEach(function(t){
        csv+='"'+(t.task_id||'')+'","'+t.shift+'班","'+(t.from_leader||'')+'","'+(t.to_leader||'')+'","'+
            (t.title||'').replace(/"/g,'""')+'","'+(t.description||'').replace(/"/g,'""').replace(/\n/g,' ')+'","'+
            (t.area||'')+'","'+(t.priority==='high'?'高':t.priority==='medium'?'中':'低')+'","'+
            catName(t.category)+'","'+statusName(t.status)+'","'+(t.created_at||'')+'"\n';
    });
    dlFile(csv,'交接班数据_'+new Date().toISOString().slice(0,10)+'.csv','text/csv');
    showToast('📊 CSV已导出');
}
function exportJSON(){
    var data={exportTime:new Date().toISOString(),tasks:allTasks,handovers:allHandovers,leaders:allLeaders};
    dlFile(JSON.stringify(data,null,2),'交接班数据_'+new Date().toISOString().slice(0,10)+'.json','application/json');
    showToast('📥 JSON已导出');
}
async function clearTasksOnly(){
    if(!isAdminUnlocked){showToast('❌ 需要管理员权限');return;}
    if(!confirm('⚠️ 确定清空所有任务？\n\n✅ 班长名单保留\n❌ 任务和交接记录删除'))return;
    if(!confirm('再次确认？'))return;
    var res=await api('/api/tasks/clear','POST');
    if(res.success){showToast('✅ '+res.message);loadAll();}
    else showToast('❌ 清空失败');
}
function dlFile(content,filename,type){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([content],{type:type}));
    a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);
}

addTaskBlock();
loadAll();
</script>
</body>
</html>
